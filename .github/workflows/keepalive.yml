name: Keep Supabase awake
# Free Supabase projects pause after 7 days without API requests. One request a day prevents that.
# Needs the repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (both are public values).
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::warning::SUPABASE_URL is not set, nothing to ping."
            exit 0
          fi
          # Any answer counts as activity; without a session the function answers with an error, which is fine.
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" -X POST "$SUPABASE_URL/rest/v1/rpc/me_get" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}'
